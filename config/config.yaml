# =====================================================================
#  Configuración del EXAMEN de la Unidad 2
# ---------------------------------------------------------------------
#  Hereda el formato "mejorado" de U2_T3B/U2_T4: todo lo que se ajusta sin
#  tocar código vive aquí. Los casos de estudio están en profe/core/catalogo.py
#  (reutilizados de U2_T4) y los bancos teóricos en config/preguntas.yaml.
#
#  El caso "que les tocó" se asigna de forma DETERMINISTA por número de control
#  (semilla): de los casos ESCALARES se elige uno; el "desconocido" es otro
#  distinto, también determinista.
#
#  Además, los COEFICIENTES de cada caso se sortean por alumno
#  (semilla(id, nc, tema, 'nominal', intento)): dos alumnos con el mismo tema
#  ven números distintos, así que la pregunta 8 (raíz) y las gráficas tampoco
#  coinciden. Se reintenta hasta que el caso conserve raíz aislable en su
#  intervalo; si no se logra, se usa el valor central del catálogo.
# =====================================================================
tarea:
  id: "U2_Examen"
  nombre: "Examen de la Unidad 2: raíces de ecuaciones"
  materia: "Métodos Numéricos"

ponderacion:
  automatico: 1.0
  manual: 0.0

evaluacion:
  tolerancia_simple: 1e-4          # respuestas numéricas (relativa)
  tolerancia_funcion: 1e-4         # raíz contra el oráculo (relativa)
  min_aprobacion: 0.80             # 80 % de los 100 puntos para poder enviar
  max_intentos: 2
  max_iter: 100
  accion: "guardar"
  # ⚠️ REEMPLAZAR por los valores reales al configurar el Apps Script de U2_Examen.
  webhook_token: "43f6f220-fc6e-4972-a69e-a11b54a629ec"
  apps_script_url: "https://script.google.com/macros/s/AKfycbzD5k2BVwJ6pHjBgbc3-f1pbV9zrX0AloZfPiCyHSrsRZ7Kfno6ZQOnqzEbTikVlO6lRQ/exec"
  # Token de examen (ventana de horario). Debe coincidir con Script Properties.
  examen_token: "d340b627-bc88-4bb4-926e-d6a2510cd8cd"

# Modo DEBUG local (NC del profesor): se ignora la ventana de horario.
debug:
  nc: "16330887"

# Los ÚNICOS casos elegidos para la actividad (13, todos escalares). Como no
# hay casos de sistema, todo mundo programa el método.
casos:
  disponibles: ["T1", "T2", "T3", "T4", "T5", "T6", "T7", "T8", "T10", "T11",
                "T12", "T17", "T18"]

# Calificación del método que programa el alumno (raiz(f, a, b)) sin que se le
# diga cuál usar. Se corre una simulación de Monte Carlo sobre la incertidumbre
# de los parámetros del caso y se compara contra el oráculo muestra por muestra.
raiz:
  N: 40                             # muestras de Monte Carlo por caso
  n_scan_oraculo: 500               # puntos del escaneo del oráculo
  peso_precision: 0.80              # peso del % de aciertos
  peso_eficiencia: 0.20             # peso de la eficiencia (iteraciones)

# ---------------------------------------------------------------------
# SLOTS del examen (100 puntos en total)
#   tipo "teorica"  -> banco de opción múltiple en config/preguntas.yaml
#   tipo "caso"     -> programar raiz(f, a, b); rol = conocido | desconocido
#   tipo "raiz"     -> numérica: reportar la raíz de SU caso (el conocido)
# ---------------------------------------------------------------------
slots:
  - {id: 1, tipo: teorica, banco: FLOTANTES,   peso: 8}
  - {id: 2, tipo: teorica, banco: HORNER,      peso: 8}
  - {id: 3, tipo: teorica, banco: ERROR,       peso: 8}
  - {id: 4, tipo: teorica, banco: METODOS,     peso: 8}
  - {id: 5, tipo: caso,     rol: conocido,     peso: 30}
  - {id: 6, tipo: caso,     rol: desconocido,  peso: 22}
  - {id: 7, tipo: teorica, banco: CONVERGENCIA, peso: 8}
  - {id: 8, tipo: raiz,     rol: conocido,     peso: 8}
